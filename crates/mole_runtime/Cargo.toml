[package]
name = "mole_runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
sdl = ["dep:image", "dep:sdl3"]
wup = ["dep:rusb"]

[dependencies]
mole_core = { path = "../mole_core" }
mole_frame_data = { path = "../mole_frame_data" }
mole_input = { path = "../mole_input" }
mole_replay = { path = "../mole_replay" }
mole_rollback = { path = "../mole_rollback" }
mole_signaling = { path = "../mole_signaling" }
mole_transport = { path = "../mole_transport" }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rusb = { version = "0.9.4", optional = true, features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl3 = { version = "0.18.4", optional = true, features = ["hidapi"] }
