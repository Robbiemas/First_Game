[package]
name = "mole_runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
sdl = ["dep:sdl3"]
wup = ["dep:rusb"]

[dependencies]
mole_core = { path = "../mole_core" }
rusb = { version = "0.9.4", optional = true, features = ["vendored"] }
sdl3 = { version = "0.18.4", optional = true, features = ["hidapi"] }
