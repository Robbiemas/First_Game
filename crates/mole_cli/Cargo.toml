[package]
name = "mole_cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mole"
path = "src/main.rs"

[dependencies]
mole_core = { path = "../mole_core" }
mole_frame_data = { path = "../mole_frame_data" }
mole_runtime = { path = "../mole_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
